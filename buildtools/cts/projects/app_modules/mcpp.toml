# `import std;` needs c++23 with mcpp today (mcpp#603); see docs/design/mcpp-build-system.md.
[package]
name     = "cts_app_modules"
version  = "0.1.0"
standard = "c++23"

# The identity the platform shells and package formats use.
[package.metadata.huxerui]
name = "CTS App Modules"
id   = "org.huxerui.cts.appmodules"

[dependencies]
huxerui        = { path = "../../../.." }
ctskit_widgets = { path = "libraries/widgets" }

# `import std;` on iOS needs a C++ standard library built for this application: the module is made from the
# toolchain's libc++ headers, and the libc++ in the iOS SDK does not carry every symbol those headers name.
[target.'cfg(os = "ios")'.dependencies]
llvm.libcxx = "22.1.8.3"
# Below the toolchain's own iOS floor, the core needs the compiler's runtime builtins built for it.
llvm.compiler-rt-builtins = "22.1.8.6"

# `app` is a program on the desktop and the Web and the application's shared library on Android.
# The platform shell owns the process entry, so each platform names its own.
[targets.cts_app_modules]
kind = "app"
main = "platform/linux/main.cpp"
windows_subsystem = "windows"

[target.'cfg(os = "windows")'.targets.cts_app_modules]
main = "platform/windows/main.cpp"

[target.'cfg(os = "macos")'.targets.cts_app_modules]
main = "platform/macos/main.cpp"

[target.'cfg(os = "ios")'.targets.cts_app_modules]
main = "platform/ios/App/main.mm"

# On the Web and Android the platform layer starts the application, so the image has no program start.
[target.'cfg(os = "emscripten")'.targets.cts_app_modules]
main = false

[target.'cfg(env = "android")'.targets.cts_app_modules]
main = false

[build]
sources = []
# The iOS deployment minimum, as the Xcode shell's IPHONEOS_DEPLOYMENT_TARGET and the CMake integration state it.
ios_deployment_target = "15.0"

# The Web build's exception model; HuxerUI requires it, and only the root package can grant it.
[target.'cfg(os = "emscripten")'.abi]
exceptions = true

# The C++ runtime inside the application's shared library on Android, as the CMake integration's `c++_static`.
[target.aarch64-linux-android]
cxx_runtime = "self-contained"

[target.x86_64-linux-android]
cxx_runtime = "self-contained"
