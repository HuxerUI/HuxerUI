# mcpp's default standard. huxerui.rules runs in this package's build program
# and imports the official mcpp:plugins distribution members, which need C++23.
[package]
name        = "huxerui-example-module-units"
version     = "0.1.0"
standard    = "c++23"
description = "One application across several module units, and what a macro costs"

# The identity the package formats use; the Windows installer's upgrade code is derived from `id`.
[package.metadata.huxerui]
name = "HuxerUI Module Units"
id   = "org.huxerui.examples.moduleunits"

[dependencies]
huxerui = { path = "../../../.." }

[targets.huxerui_example_module_units]
kind = "bin"
main = "src/main.cpp"

[build]
sources = []

# The Windows executable's icon and version metadata. FILEVERSION, ProductName
# and FileDescription default from [package]. Only PE targets compile it; on
# Linux and macOS the table is inapplicable and the build is byte-identical.
[resources]
icon = "assets/app.ico"
