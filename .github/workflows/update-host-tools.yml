name: Update Host Tools

on:
  push:
    branches: [main]
    paths:
      - 'tools/codegen/**'
      - 'tools/resource_compiler/**'
      - 'src/resources/resource_format.h'
      - 'src/resources/vector_format.h'
      - 'scripts/build_tools.sh'
      - 'scripts/build_tools.ps1'
      - '.github/workflows/update-host-tools.yml'
      - '.github/workflows/scripts/host_tools.py'
      - '.github/workflows/scripts/check_linux_binary_compatibility.sh'
      - '.github/workflows/scripts/check_apple_deployment_target.sh'
      - 'tests/scripts/host_tools_test.py'
      - 'tests/scripts/build_tools_generator.sh'
      - '!**.[mM][dD]'
  workflow_dispatch:
    inputs:
      update_prebuilts:
        description: Commit validated tools back to main
        type: boolean
        default: true

permissions:
  contents: read

env:
  CMAKE_GENERATOR: Ninja
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  PYTHONDONTWRITEBYTECODE: 1
  ANDROID_NDK_VERSION: 29.0.14206865

defaults:
  run:
    shell: bash

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run: ${{ steps.plan.outputs.run }}
      update: ${{ steps.plan.outputs.update }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Select build or validation
        id: plan
        run: python .github/workflows/scripts/host_tools.py plan
      - name: Test workflow support
        if: steps.plan.outputs.run == 'true'
        run: python tests/scripts/host_tools_test.py

  build:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows
            architecture: x86_64
          - runner: macos-15
            platform: macos
            architecture: arm64
          - runner: macos-15-intel
            platform: macos
            architecture: x86_64
          - runner: ubuntu-24.04
            platform: linux
            architecture: x86_64
            image: quay.io/pypa/manylinux_2_28_x86_64
          - runner: ubuntu-24.04-arm
            platform: linux
            architecture: aarch64
            image: quay.io/pypa/manylinux_2_28_aarch64
          - runner: ubuntu-24.04
            platform: android
            architecture: arm64-v8a
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: matrix.platform == 'windows'
        with:
          arch: x64
      - name: Build Windows tools
        if: matrix.platform == 'windows'
        shell: pwsh
        run: >-
          ./scripts/build_tools.ps1 -Platform windows -Architecture x86_64
          -OutputDirectory "$env:RUNNER_TEMP/host-tools/windows/x86_64"
      - name: Build macOS tools
        if: matrix.platform == 'macos'
        env:
          TOOL_ARCHITECTURE: ${{ matrix.architecture }}
        run: >-
          sh scripts/build_tools.sh --platform macos --architecture "${TOOL_ARCHITECTURE}"
          --output-dir "${RUNNER_TEMP}/host-tools/macos/${TOOL_ARCHITECTURE}"
      - name: Build Linux tools with GLIBC 2.28
        if: matrix.platform == 'linux'
        env:
          TOOL_ARCHITECTURE: ${{ matrix.architecture }}
          TOOL_IMAGE: ${{ matrix.image }}
        run: |
          mkdir -p "${RUNNER_TEMP}/host-tools/linux/${TOOL_ARCHITECTURE}"
          docker run --rm --user "$(id -u):$(id -g)" \
            --env TOOL_ARCHITECTURE --env CMAKE_BUILD_PARALLEL_LEVEL \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --volume "${RUNNER_TEMP}/host-tools:/output" \
            --workdir /workspace "${TOOL_IMAGE}" \
            bash -lc '
              sh scripts/build_tools.sh --platform linux --architecture "${TOOL_ARCHITECTURE}" \
                --output-dir "/output/linux/${TOOL_ARCHITECTURE}"
            '
          HUXERUI_MAX_GLIBC=2.28 HUXERUI_REQUIRE_STATIC_CXX=true \
            sh .github/workflows/scripts/check_linux_binary_compatibility.sh \
              "${RUNNER_TEMP}/host-tools/linux/${TOOL_ARCHITECTURE}/hcg" \
              "${RUNNER_TEMP}/host-tools/linux/${TOOL_ARCHITECTURE}/hrc"
      - name: Build Android host tools
        if: matrix.platform == 'android'
        run: |
          set +o pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "ndk;${ANDROID_NDK_VERSION}"
          sh scripts/build_tools.sh --platform android --architecture arm64-v8a \
            --android-ndk "${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" \
            --output-dir "${RUNNER_TEMP}/host-tools/android/arm64-v8a"
          readelf="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for tool in hcg hrc; do
            binary="${RUNNER_TEMP}/host-tools/android/arm64-v8a/${tool}"
            "${readelf}" --program-headers "${binary}" | grep -F '/system/bin/linker64'
            dependencies="$("${readelf}" --dynamic "${binary}")"
            if printf '%s\n' "${dependencies}" | grep -F 'libc++_shared.so'; then
              echo 'HuxerUI Android host tools must not require an unpackaged C++ runtime' >&2
              exit 1
            fi
          done
      - name: Validate macOS deployment targets
        if: matrix.platform == 'macos'
        env:
          TOOL_ARCHITECTURE: ${{ matrix.architecture }}
        run: >-
          sh .github/workflows/scripts/check_apple_deployment_target.sh 12.0
          "${RUNNER_TEMP}/host-tools/macos/${TOOL_ARCHITECTURE}/hcg"
          "${RUNNER_TEMP}/host-tools/macos/${TOOL_ARCHITECTURE}/hrc"
      - name: Exercise native executables
        if: matrix.platform != 'android'
        env:
          TOOL_PACKAGE: ${{ matrix.platform }}/${{ matrix.architecture }}
        run: >-
          python .github/workflows/scripts/host_tools.py smoke
          --directory "${RUNNER_TEMP}/host-tools/${TOOL_PACKAGE}"
      - name: Test shell generator selection
        if: matrix.platform == 'linux'
        run: sh tests/scripts/build_tools_generator.sh "${GITHUB_WORKSPACE}"
      - name: Package validated tools
        env:
          TOOL_PACKAGE: ${{ matrix.platform }}/${{ matrix.architecture }}
        run: >-
          python .github/workflows/scripts/host_tools.py pack
          --package "${TOOL_PACKAGE}"
          --directory "${RUNNER_TEMP}/host-tools/${TOOL_PACKAGE}"
          --output "${RUNNER_TEMP}/host-tool-artifacts"
          --revision "${GITHUB_SHA}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: host-tools-${{ matrix.platform }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/host-tool-artifacts/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.update == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require a separately authorized writeback credential
        env:
          PUSH_TOKEN: ${{ secrets.HOST_TOOLS_PUSH_TOKEN }}
        run: |
          if [ -z "${PUSH_TOKEN}" ]; then
            echo 'HuxerUI host tools: configure HOST_TOOLS_PUSH_TOKEN with permission to push to protected main' >&2
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.HOST_TOOLS_PUSH_TOKEN }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: host-tools-*
          merge-multiple: true
          path: ${{ runner.temp }}/host-tool-artifacts
      - name: Publish all packages with a fast-forward-only push
        run: >-
          python .github/workflows/scripts/host_tools.py publish
          --directory "${RUNNER_TEMP}/host-tool-artifacts"
          --revision "${GITHUB_SHA}"
