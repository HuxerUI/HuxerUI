name: SDK Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate tag and version
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          cmake
          -DSOURCE_DIRECTORY=${{ github.workspace }}
          -DRELEASE_TAG=${RELEASE_TAG}
          -DOUTPUT_FILE=${GITHUB_OUTPUT}
          -P ${{ github.workspace }}/cmake/ValidateSdkRelease.cmake

  platform-artifacts:
    name: Build Android and Web SDK artifacts
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Prepare platform artifact tools
        run: >-
          chmod +x
          platform/android/gradlew
          tools/prebuilt/linux/x86_64/hcg
          tools/prebuilt/linux/x86_64/hrc
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android toolchain
        run: |
          set +o pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "platform-tools" \
            "ndk;29.0.14206865"
      - name: Build Android artifacts
        working-directory: platform/android
        run: |
          ./gradlew :HuxerUI:assembleRelease
          mkdir -p "${RUNNER_TEMP}/huxerui-platform-artifacts/android/aar"
          aar="$(find huxerui/build/outputs/aar -name '*-release.aar' -print -quit)"
          unzip -q "${aar}" -d "${RUNNER_TEMP}/huxerui-platform-artifacts/android/aar"
          for abi in arm64-v8a x86_64; do
            mkdir -p "${RUNNER_TEMP}/huxerui-platform-artifacts/android/${abi}"
            cp "${RUNNER_TEMP}/huxerui-platform-artifacts/android/aar/jni/${abi}/libhuxerui.so" \
              "${RUNNER_TEMP}/huxerui-platform-artifacts/android/${abi}/libhuxerui.so"
            static_library="$(find huxerui/.cxx -path "*/${abi}/lib/libhuxerui_static.a" -print -quit)"
            cp "${static_library}" \
              "${RUNNER_TEMP}/huxerui-platform-artifacts/android/${abi}/libhuxerui_static.a"
          done
          rm -rf "${RUNNER_TEMP}/huxerui-platform-artifacts/android/aar/jni" \
            "${RUNNER_TEMP}/huxerui-platform-artifacts/android/aar/prefab"
          cd "${RUNNER_TEMP}/huxerui-platform-artifacts/android/aar"
          zip -qr ../HuxerUI.aar .
          cd ..
          rm -rf aar
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.19
      - name: Build Web artifacts
        run: |
          emcmake cmake -S . -B build-web \
            -DCMAKE_BUILD_TYPE=Release \
            -DHUXERUI_BUILD_SHARED=OFF \
            -DHUXERUI_BUILD_STATIC=ON \
            -DHUXERUI_BUILD_CLI=OFF \
            -DHUXERUI_BUILD_EXAMPLES=OFF \
            -DHUXERUI_BUILD_TESTS=OFF
          cmake --build build-web --target huxerui_static --parallel
          mkdir -p "${RUNNER_TEMP}/huxerui-platform-artifacts/web/emscripten-4.0.19"
          cp build-web/lib/libhuxerui_static.a \
            "${RUNNER_TEMP}/huxerui-platform-artifacts/web/emscripten-4.0.19/libhuxerui.a"
      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdk-platform-artifacts
          path: ${{ runner.temp }}/huxerui-platform-artifacts
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build ${{ matrix.system }} ${{ matrix.architecture }}
    needs:
      - validate
      - platform-artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            system: macos
            architecture: arm64
            generator: TGZ
            extension: tar.gz
          - runner: macos-15-intel
            system: macos
            architecture: x86_64
            generator: TGZ
            extension: tar.gz
          - runner: windows-2022
            system: windows
            architecture: x86_64
            generator: ZIP
            extension: zip
          - runner: ubuntu-24.04
            system: linux
            architecture: x86_64
            generator: TGZ
            extension: tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          name: sdk-platform-artifacts
          path: sdk-platform-artifacts
      - name: Prepare Unix executables
        if: runner.os != 'Windows'
        run: >-
          chmod +x
          install.sh
          tools/prebuilt/${{ matrix.system }}/${{ matrix.architecture }}/hcg
          tools/prebuilt/${{ matrix.system }}/${{ matrix.architecture }}/hrc
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          gperf libegl1-mesa-dev libgles2-mesa-dev libglib2.0-dev libsoup-3.0-dev
          libx11-dev libxext-dev libxkbcommon-dev libxrandr-dev meson ninja-build pkg-config
      - name: Configure
        run: >-
          cmake
          -S .
          -B build
          -DCMAKE_BUILD_TYPE=Release
          -DHUXERUI_BUILD_CLI=ON
          -DHUXERUI_BUILD_EXAMPLES=OFF
          -DHUXERUI_BUILD_TESTS=ON
          -DHUXERUI_SDK_PLATFORM_ARTIFACT_ROOT=${{ github.workspace }}/sdk-platform-artifacts
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        run: >-
          cpack
          --config build/CPackConfig.cmake
          -C Release
          -G ${{ matrix.generator }}
          -B release-assets
      - name: Test packaged Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SDK_ARCHIVE: ${{ github.workspace }}\release-assets\huxerui-sdk-${{ needs.validate.outputs.version }}-windows-x86_64.zip
          SDK_PREFIX: ${{ runner.temp }}\HuxerUI SDK
        run: |
          $oldHome = [Environment]::GetEnvironmentVariable("HUXERUI_HOME", "User")
          $oldPath = [Environment]::GetEnvironmentVariable("Path", "User")
          $installer = Join-Path $env:GITHUB_WORKSPACE "install.ps1"
          $cli = Join-Path $env:SDK_PREFIX "bin\huxerui.exe"
          try {
              & pwsh -NoProfile -File $installer -Archive $env:SDK_ARCHIVE -Prefix $env:SDK_PREFIX -Yes
              if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $cli -PathType Leaf)) {
                  throw "Windows SDK installation failed"
              }
              $selectedHome = [Environment]::GetEnvironmentVariable("HUXERUI_HOME", "User")
              if (-not [string]::Equals($selectedHome, $env:SDK_PREFIX, [System.StringComparison]::OrdinalIgnoreCase)) {
                  throw "Windows SDK installation did not select HUXERUI_HOME"
              }
              $versionOutput = & $cli --version
              if ($LASTEXITCODE -ne 0 -or $versionOutput -notmatch '^huxerui [0-9]+\.[0-9]+\.[0-9]+$') {
                  throw "Installed Windows SDK CLI did not run"
              }
              & pwsh -NoProfile -File $installer -Uninstall -Prefix $env:SDK_PREFIX -Yes
              if ($LASTEXITCODE -ne 0 -or (Test-Path -LiteralPath $env:SDK_PREFIX)) {
                  throw "Windows SDK uninstall failed"
              }
          } finally {
              [Environment]::SetEnvironmentVariable("HUXERUI_HOME", $oldHome, "User")
              [Environment]::SetEnvironmentVariable("Path", $oldPath, "User")
              if (Test-Path -LiteralPath $env:SDK_PREFIX) {
                  Remove-Item -LiteralPath $env:SDK_PREFIX -Recurse -Force
              }
          }
      - name: Upload SDK archive
        uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.system }}-${{ matrix.architecture }}
          path: |
            release-assets/huxerui-sdk-${{ needs.validate.outputs.version }}-${{ matrix.system }}-${{ matrix.architecture }}.${{ matrix.extension }}
            release-assets/huxerui-sdk-${{ needs.validate.outputs.version }}-${{ matrix.system }}-${{ matrix.architecture }}.${{ matrix.extension }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish release
    needs:
      - validate
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Download SDK archives
        uses: actions/download-artifact@v4
        with:
          pattern: sdk-*
          path: release-assets
          merge-multiple: true
      - name: Add installers
        run: cp install.sh install.ps1 release-assets/
      - name: Validate release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          cmake
          -DSOURCE_DIRECTORY=${{ github.workspace }}
          -DRELEASE_TAG=${RELEASE_TAG}
          -DASSET_DIRECTORY=${{ github.workspace }}/release-assets
          -P ${{ github.workspace }}/cmake/ValidateSdkRelease.cmake
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --draft \
              --prerelease=false \
              --title "HuxerUI ${RELEASE_VERSION}" \
              --verify-tag
          else
            gh release create "${RELEASE_TAG}" \
              --draft \
              --generate-notes \
              --title "HuxerUI ${RELEASE_VERSION}" \
              --verify-tag
          fi
          gh release upload "${RELEASE_TAG}" release-assets/* --clobber
          gh release edit "${RELEASE_TAG}" --draft=false --prerelease=false
