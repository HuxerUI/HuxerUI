name: SDK Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create or reuse
        required: true
        type: string
      validation_only:
        description: Build and validate artifacts without creating a tag or release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_only && github.sha || github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

concurrency:
  group: sdk-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate tag and version
        id: release
        run: >-
          cmake
          -DSOURCE_DIRECTORY=${{ github.workspace }}
          -DRELEASE_TAG=${RELEASE_TAG}
          -DOUTPUT_FILE=${GITHUB_OUTPUT}
          -P ${{ github.workspace }}/cmake/ValidateSdkRelease.cmake
      - name: Create release tag
        if: github.event_name == 'workflow_dispatch' && inputs.validation_only == false
        run: |
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            existing_commit="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
            if [ "${existing_commit}" != "${GITHUB_SHA}" ]; then
              echo "Release tag ${RELEASE_TAG} already points to ${existing_commit}, not ${GITHUB_SHA}" >&2
              exit 1
            fi
            echo "Release tag ${RELEASE_TAG} already points to ${GITHUB_SHA}"
            exit 0
          fi

          git tag "${RELEASE_TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${RELEASE_TAG}"

  android-artifacts:
    name: Build Android SDK artifacts
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Build Linux host tools
        run: |
          chmod +x platform/android/gradlew scripts/build_tools.sh
          sh scripts/build_tools.sh --platform linux --architecture x86_64
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android toolchain
        run: |
          set +o pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "platform-tools" \
            "ndk;29.0.14206865"
      - name: Build Android artifacts
        working-directory: platform/android
        run: |
          ./gradlew :HuxerUI:assembleRelease -PhuxeruiBuildNative=true
          mkdir -p "${RUNNER_TEMP}/huxerui-platform-artifacts/android/aar"
          aar="$(find huxerui/build/outputs/aar -name '*-release.aar' -print -quit)"
          unzip -q "${aar}" -d "${RUNNER_TEMP}/huxerui-platform-artifacts/android/aar"
          for abi in arm64-v8a x86_64; do
            mkdir -p "${RUNNER_TEMP}/huxerui-platform-artifacts/android/${abi}"
            cp "${RUNNER_TEMP}/huxerui-platform-artifacts/android/aar/jni/${abi}/libhuxerui.so" \
              "${RUNNER_TEMP}/huxerui-platform-artifacts/android/${abi}/libhuxerui.so"
          done
          rm -rf "${RUNNER_TEMP}/huxerui-platform-artifacts/android/aar/jni" \
            "${RUNNER_TEMP}/huxerui-platform-artifacts/android/aar/prefab"
          cd "${RUNNER_TEMP}/huxerui-platform-artifacts/android/aar"
          zip -qr ../HuxerUI.aar .
          cd ..
          rm -rf aar
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: platform-artifacts-android
          path: ${{ runner.temp }}/huxerui-platform-artifacts
          if-no-files-found: error
          retention-days: 7

  web-artifacts:
    name: Build Web SDK artifacts
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Build Linux host tools
        run: |
          chmod +x scripts/build_tools.sh
          sh scripts/build_tools.sh --platform linux --architecture x86_64
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.19
      - name: Build Web artifacts
        run: |
          emcmake cmake -S . -B build-web \
            -DCMAKE_BUILD_TYPE=Release \
            -DHUXERUI_BUILD_SHARED=OFF \
            -DHUXERUI_BUILD_STATIC=ON \
            -DHUXERUI_BUILD_CLI=OFF \
            -DHUXERUI_BUILD_EXAMPLES=OFF \
            -DHUXERUI_BUILD_TESTS=OFF
          cmake --build build-web --target huxerui_static --parallel
          mkdir -p "${RUNNER_TEMP}/huxerui-platform-artifacts/web/emscripten-4.0.19"
          cp build-web/lib/libhuxerui_static.a \
            "${RUNNER_TEMP}/huxerui-platform-artifacts/web/emscripten-4.0.19/libhuxerui.a"
      - name: Upload Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: platform-artifacts-web
          path: ${{ runner.temp }}/huxerui-platform-artifacts
          if-no-files-found: error
          retention-days: 7

  ios-artifacts:
    name: Build iOS SDK artifacts
    needs: validate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Build macOS host tools
        run: |
          chmod +x scripts/build_tools.sh
          sh scripts/build_tools.sh --platform macos --architecture arm64
      - name: Build iOS artifacts
        run: >-
          sh scripts/build_ios_xcframework.sh
          "${{ github.workspace }}"
          "${{ runner.temp }}/huxerui-ios-build"
          "${{ runner.temp }}/huxerui-platform-artifacts/ios/HuxerUI.xcframework"
          Release
      - name: Validate Apple deployment targets
        run: |
          sh .github/workflows/scripts/check_apple_deployment_target.sh 12.0 \
            tools/prebuilt/macos/arm64/hcg \
            tools/prebuilt/macos/arm64/hrc
          sh .github/workflows/scripts/check_apple_deployment_target.sh 15.0 \
            "${RUNNER_TEMP}/huxerui-platform-artifacts/ios/HuxerUI.xcframework/ios-arm64/libhuxerui_static.a" \
            "${RUNNER_TEMP}/huxerui-platform-artifacts/ios/HuxerUI.xcframework/ios-arm64_x86_64-simulator/libhuxerui_static.a"
      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: platform-artifacts-ios
          path: ${{ runner.temp }}/huxerui-platform-artifacts
          if-no-files-found: error
          retention-days: 7

  linux-host-tools:
    name: Build Linux ${{ matrix.architecture }} host tools
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
            image: quay.io/pypa/manylinux_2_28_x86_64
          - runner: ubuntu-24.04-arm
            architecture: aarch64
            image: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Build host tools with GLIBC 2.28
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            "${{ matrix.image }}" \
            bash -lc 'sh scripts/build_tools.sh --platform linux --architecture ${{ matrix.architecture }}'
          chmod +x \
            "tools/prebuilt/linux/${{ matrix.architecture }}/hcg" \
            "tools/prebuilt/linux/${{ matrix.architecture }}/hrc"
          HUXERUI_MAX_GLIBC=2.28 HUXERUI_REQUIRE_STATIC_CXX=true \
            sh .github/workflows/scripts/check_linux_binary_compatibility.sh \
            "tools/prebuilt/linux/${{ matrix.architecture }}/hcg" \
            "tools/prebuilt/linux/${{ matrix.architecture }}/hrc"
      - name: Upload Linux host tools
        uses: actions/upload-artifact@v4
        with:
          name: host-tools-linux-${{ matrix.architecture }}
          path: tools/prebuilt/linux/${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows x86_64
    needs:
      - validate
      - android-artifacts
      - web-artifacts
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: platform-artifacts-android
          path: platform-artifacts
      - name: Download Web artifacts
        uses: actions/download-artifact@v4
        with:
          name: platform-artifacts-web
          path: platform-artifacts
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build Windows host tools
        shell: pwsh
        run: .\scripts\build_tools.ps1 -Platform windows -Architecture x86_64
      - name: Configure
        run: >-
          cmake
          -S .
          -B build
          -DCMAKE_BUILD_TYPE=Release
          -DHUXERUI_BUILD_CLI=ON
          -DHUXERUI_BUILD_EXAMPLES=OFF
          -DHUXERUI_BUILD_TESTS=ON
          -DHUXERUI_INTERNAL_SDK_ARTIFACT_ROOT=${{ github.workspace }}/platform-artifacts
          -DHUXERUI_INTERNAL_PACKAGE_WINDOWS_DEBUG=ON
      - name: Build Windows Debug libraries
        run: >-
          cmake
          --build build
          --config Debug
          --target huxerui huxerui_static
          --parallel 4
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        run: >-
          cpack
          --config build/CPackConfig.cmake
          -C Release
          -G ZIP
          -B release-assets
      - name: Test packaged Windows installer
        shell: pwsh
        env:
          SDK_ARCHIVE: ${{ github.workspace }}\release-assets\huxerui-sdk-${{ needs.validate.outputs.version }}-windows-x86_64.zip
          SDK_PREFIX: ${{ runner.temp }}\HuxerUI SDK
        run: |
          $oldHome = [Environment]::GetEnvironmentVariable("HUXERUI_HOME", "User")
          $oldPath = [Environment]::GetEnvironmentVariable("Path", "User")
          $installer = Join-Path $env:GITHUB_WORKSPACE "install.ps1"
          $cli = Join-Path $env:SDK_PREFIX "bin\huxerui.exe"
          try {
              & pwsh -NoProfile -File $installer -Archive $env:SDK_ARCHIVE -Prefix $env:SDK_PREFIX -Yes
              if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $cli -PathType Leaf)) {
                  throw "Windows SDK installation failed"
              }
              $selectedHome = [Environment]::GetEnvironmentVariable("HUXERUI_HOME", "User")
              if (-not [string]::Equals($selectedHome, $env:SDK_PREFIX, [System.StringComparison]::OrdinalIgnoreCase)) {
                  throw "Windows SDK installation did not select HUXERUI_HOME"
              }
              $versionOutput = & $cli --version
              if ($LASTEXITCODE -ne 0 -or $versionOutput -notmatch '^huxerui [0-9]+\.[0-9]+\.[0-9]+$') {
                  throw "Installed Windows SDK CLI did not run"
              }
              & pwsh -NoProfile -File $installer -Uninstall -Prefix $env:SDK_PREFIX -Yes
              if ($LASTEXITCODE -ne 0 -or (Test-Path -LiteralPath $env:SDK_PREFIX)) {
                  throw "Windows SDK uninstall failed"
              }
          } finally {
              [Environment]::SetEnvironmentVariable("HUXERUI_HOME", $oldHome, "User")
              [Environment]::SetEnvironmentVariable("Path", $oldPath, "User")
              if (Test-Path -LiteralPath $env:SDK_PREFIX) {
                  Remove-Item -LiteralPath $env:SDK_PREFIX -Recurse -Force
              }
          }
      - name: Upload SDK archive
        uses: actions/upload-artifact@v4
        with:
          name: sdk-windows-x86_64
          path: |
            release-assets/huxerui-sdk-${{ needs.validate.outputs.version }}-windows-x86_64.zip
            release-assets/huxerui-sdk-${{ needs.validate.outputs.version }}-windows-x86_64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-macos:
    name: Build macOS ${{ matrix.architecture }}
    needs:
      - validate
      - android-artifacts
      - web-artifacts
      - ios-artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            parallel_jobs: 3
          - runner: macos-15-intel
            architecture: x86_64
            parallel_jobs: 4
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: platform-artifacts-android
          path: platform-artifacts
      - name: Download Web artifacts
        uses: actions/download-artifact@v4
        with:
          name: platform-artifacts-web
          path: platform-artifacts
      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: platform-artifacts-ios
          path: platform-artifacts
      - name: Build macOS host tools
        run: |
          chmod +x install.sh scripts/build_tools.sh
          sh scripts/build_tools.sh --platform macos --architecture "${{ matrix.architecture }}"
      - name: Configure
        run: >-
          cmake
          -S .
          -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          -DHUXERUI_BUILD_CLI=ON
          -DHUXERUI_BUILD_EXAMPLES=OFF
          -DHUXERUI_BUILD_TESTS=ON
          -DHUXERUI_INTERNAL_SDK_ARTIFACT_ROOT=${{ github.workspace }}/platform-artifacts
      - name: Build
        run: cmake --build build --config Release --parallel "${{ matrix.parallel_jobs }}"
      - name: Validate macOS deployment targets
        run: |
          sh .github/workflows/scripts/check_apple_deployment_target.sh 12.0 \
            "tools/prebuilt/macos/${{ matrix.architecture }}/hcg" \
            "tools/prebuilt/macos/${{ matrix.architecture }}/hrc" \
            build/bin/huxerui \
            build/lib/libhuxerui.dylib \
            build/lib/libhuxerui_static.a
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        run: >-
          cpack
          --config build/CPackConfig.cmake
          -C Release
          -G TGZ
          -B release-assets
      - name: Upload SDK archive
        uses: actions/upload-artifact@v4
        with:
          name: sdk-macos-${{ matrix.architecture }}
          path: |
            release-assets/huxerui-sdk-${{ needs.validate.outputs.version }}-macos-${{ matrix.architecture }}.tar.gz
            release-assets/huxerui-sdk-${{ needs.validate.outputs.version }}-macos-${{ matrix.architecture }}.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-linux:
    name: Build Linux ${{ matrix.architecture }}
    needs:
      - validate
      - android-artifacts
      - web-artifacts
      - linux-host-tools
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
            parallel_jobs: 4
          - runner: ubuntu-24.04-arm
            architecture: aarch64
            parallel_jobs: 4
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: platform-artifacts-android
          path: platform-artifacts
      - name: Download Web artifacts
        uses: actions/download-artifact@v4
        with:
          name: platform-artifacts-web
          path: platform-artifacts
      - name: Download Linux host tools
        uses: actions/download-artifact@v4
        with:
          name: host-tools-linux-${{ matrix.architecture }}
          path: tools/prebuilt/linux/${{ matrix.architecture }}
      - name: Install Linux build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            binutils ca-certificates fontconfig fonts-dejavu-core gdb git libgtk-4-dev \
            libsoup-3.0-dev ninja-build pkg-config python3-pip software-properties-common
          add-apt-repository -y ppa:ubuntu-toolchain-r/test
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y gcc-14 g++-14
          python3 -m pip install cmake==3.31.10
      - name: Prepare executables
        run: >-
          chmod +x
          install.sh
          tools/prebuilt/linux/${{ matrix.architecture }}/hcg
          tools/prebuilt/linux/${{ matrix.architecture }}/hrc
      - name: Configure
        run: >-
          cmake
          -S .
          -B build
          -DCMAKE_BUILD_TYPE=Release
          -DHUXERUI_BUILD_CLI=ON
          -DHUXERUI_BUILD_EXAMPLES=OFF
          -DHUXERUI_BUILD_TESTS=ON
          -DHUXERUI_INTERNAL_SDK_ARTIFACT_ROOT=${GITHUB_WORKSPACE}/platform-artifacts
      - name: Build
        run: cmake --build build --parallel "${{ matrix.parallel_jobs }}"
      - name: Test
        run: bash .github/workflows/scripts/run_linux_tests.sh build
      - name: Collect Linux failure diagnostics
        if: failure()
        run: >-
          bash .github/workflows/scripts/collect_linux_test_diagnostics.sh
          build
          "${RUNNER_TEMP}/huxerui-linux-test-diagnostics"
          "${GITHUB_WORKSPACE}"
      - name: Upload Linux failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-diagnostics-${{ matrix.architecture }}
          path: ${{ runner.temp }}/huxerui-linux-test-diagnostics
          if-no-files-found: error
          retention-days: 7
      - name: Validate Linux SDK binary compatibility
        run: >-
          sh .github/workflows/scripts/check_linux_binary_compatibility.sh
          build/lib/libhuxerui.so
          build/bin/huxerui
      - name: Package
        run: >-
          cpack
          --config build/CPackConfig.cmake
          -C Release
          -G TGZ
          -B release-assets
      - name: Upload SDK archive
        uses: actions/upload-artifact@v4
        with:
          name: sdk-linux-${{ matrix.architecture }}
          path: |
            release-assets/huxerui-sdk-${{ needs.validate.outputs.version }}-linux-${{ matrix.architecture }}.tar.gz
            release-assets/huxerui-sdk-${{ needs.validate.outputs.version }}-linux-${{ matrix.architecture }}.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-android-host:
    name: Build Android arm64-v8a host SDK
    needs:
      - validate
      - android-artifacts
      - web-artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: platform-artifacts-android
          path: platform-artifacts
      - name: Download Web artifacts
        uses: actions/download-artifact@v4
        with:
          name: platform-artifacts-web
          path: platform-artifacts
      - name: Install Android NDK
        run: |
          set +o pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865"
      - name: Build host tools
        run: |
          chmod +x scripts/build_tools.sh
          sh scripts/build_tools.sh --platform linux --architecture x86_64
          sh scripts/build_tools.sh \
            --platform android \
            --architecture arm64-v8a \
            --android-ndk "${ANDROID_HOME}/ndk/29.0.14206865"
      - name: Configure Android host SDK
        run: >-
          cmake
          -S .
          -B build-android-host
          -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=${ANDROID_HOME}/ndk/29.0.14206865/build/cmake/android.toolchain.cmake
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-24
          -DCMAKE_BUILD_TYPE=Release
          -DHUXERUI_BUILD_SHARED=ON
          -DHUXERUI_BUILD_STATIC=OFF
          -DHUXERUI_BUILD_CLI=ON
          -DHUXERUI_BUILD_EXAMPLES=OFF
          -DHUXERUI_BUILD_TESTS=OFF
          -DHUXERUI_INTERNAL_SDK_ARTIFACT_ROOT=${{ github.workspace }}/platform-artifacts
      - name: Build Android host SDK
        run: cmake --build build-android-host --parallel
      - name: Package Android host SDK
        run: >-
          cpack
          --config build-android-host/CPackConfig.cmake
          -C Release
          -G TGZ
          -B release-assets
      - name: Validate Android host SDK
        env:
          SDK_ROOT: ${{ runner.temp }}/android-host-sdk
          SDK_ARCHIVE: ${{ github.workspace }}/release-assets/huxerui-sdk-${{ needs.validate.outputs.version }}-android-arm64-v8a.tar.gz
        run: |
          mkdir -p "${SDK_ROOT}"
          tar -xzf "${SDK_ARCHIVE}" -C "${SDK_ROOT}" --strip-components=1
          for executable in \
            "${SDK_ROOT}/bin/huxerui" \
            "${SDK_ROOT}/share/huxerui/tools/android/arm64-v8a/hcg" \
            "${SDK_ROOT}/share/huxerui/tools/android/arm64-v8a/hrc"; do
            test -x "${executable}"
            "${ANDROID_HOME}/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
              --program-headers "${executable}" | grep -F '/system/bin/linker64'
          done
          test -f "${SDK_ROOT}/include/huxerui/huxerui.h"
          test -f "${SDK_ROOT}/lib/cmake/HuxerUI/HuxerUIConfig.cmake"
          test -f "${SDK_ROOT}/share/huxerui/resources/huxerui/resources.bin"
          test -f "${SDK_ROOT}/share/huxerui/platform/android/HuxerUI.aar"
      - name: Upload Android host SDK archive
        uses: actions/upload-artifact@v4
        with:
          name: sdk-android-arm64-v8a
          path: |
            release-assets/huxerui-sdk-${{ needs.validate.outputs.version }}-android-arm64-v8a.tar.gz
            release-assets/huxerui-sdk-${{ needs.validate.outputs.version }}-android-arm64-v8a.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish release
    if: github.event_name != 'workflow_dispatch' || inputs.validation_only == false
    needs:
      - validate
      - build-windows
      - build-macos
      - build-linux
      - build-android-host
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Download SDK archives
        uses: actions/download-artifact@v4
        with:
          pattern: sdk-*
          path: release-assets
          merge-multiple: true
      - name: Add installers
        run: cp install.sh install.ps1 release-assets/
      - name: Validate release assets
        run: >-
          cmake
          -DSOURCE_DIRECTORY=${{ github.workspace }}
          -DRELEASE_TAG=${RELEASE_TAG}
          -DASSET_DIRECTORY=${{ github.workspace }}/release-assets
          -P ${{ github.workspace }}/cmake/ValidateSdkRelease.cmake
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --draft \
              --prerelease=false \
              --title "HuxerUI ${RELEASE_VERSION}" \
              --verify-tag
          else
            gh release create "${RELEASE_TAG}" \
              --draft \
              --generate-notes \
              --title "HuxerUI ${RELEASE_VERSION}" \
              --verify-tag
          fi
          gh release upload "${RELEASE_TAG}" release-assets/* --clobber
          gh release edit "${RELEASE_TAG}" --draft=false --prerelease=false
