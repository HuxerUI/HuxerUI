# -------------------------------------------------------------- Windows ----
[target.windows.build]
# windows_installer.cpp is NOT part of the framework: it is the WiX custom-action
# DLL, built as a separate SDK artifact by cmake/HuxerUISdk.cmake:131. A bare
# `platform/windows/*.cpp` glob sweeps it into libhuxerui, which is what
# `huxerui-build-check` caught before this ever ran on Windows.
sources  = ["platform/windows/*.cpp", "!platform/windows/windows_installer.cpp"]
defines  = ["UNICODE", "_UNICODE", "NOMINMAX", "WIN32_LEAN_AND_MEAN",
            "WINVER=0x0A00", "_WIN32_WINNT=0x0A00"]
# NO MSVC-DIALECT FLAGS. mcpp builds Windows with clang targeting
# x86_64-windows-msvc -- the MSVC ABI and the Windows SDK, not MinGW -- and its
# GNU driver rejects `/W4`, `/permissive-` and `/utf-8` outright
# ("error: no such file or directory: '/W4'"). The warning level is already set
# once in the base [build] cxxflags, and clang reads UTF-8 by default.
#
# `[toolchain] windows = "msvc"` would put both build systems on one compiler
# and was tried; mcpp 2026.9.8.1 then hands the host module's BMI to cl.exe in
# clang's `name=path` spelling and the link fails with
# `LNK1104: cannot open file 'huxerui.rules=...ifc'`. NOT RE-TESTED on the
# 2026.9.10.2 this repository now pins -- the observation above is from 9.8.1
# and the bug may already be gone. Retry `windows = "msvc"` before treating
# this paragraph as current.

# The WiX toolset, for projects that build a Windows installer. It is an
# xlings payload rather than a NuGet restore inside this repository: WiX is a
# general-purpose tool, and the download-and-verify that used to live in
# cmake/HuxerUIWindowsInstaller.cmake is index work.
#
# Declared by the framework so that a consumer gets it through the dependency
# edge -- xpkg_dir answers for a package a DEPENDENCY declared (mcpp
# 2026.9.6.6+), so an application's build.mcpp reaches it without naming it.
[target.windows.xlings.workspace]
"xim:wix" = "5.0.2"

[target.windows.runtime]
# The first group is what cmake/platform/Windows.cmake names explicitly.
#
# The second is what CMake adds IMPLICITLY and mcpp does not:
# CMAKE_CXX_STANDARD_LIBRARIES defaults to kernel32/user32/gdi32/winspool/
# shell32/ole32/oleaut32/uuid/comdlg32/advapi32, so a CMake target links them
# whether or not it says so. mcpp names exactly what the manifest names, so the
# omission surfaces at the link -- measured as
# `lld-link: error: undefined symbol: __declspec(dllimport) CreateDIBSection`
# from win32_system_tray.cpp, which uses GDI without gdi32 ever being listed.
libraries = ["advapi32", "d2d1", "d3d11", "dwrite", "dwmapi", "dxguid", "dxgi",
             "imm32", "ole32", "oleaut32", "psapi", "shell32", "uiautomationcore",
             "user32", "winhttp", "windowscodecs",
             "dcomp", "windowsapp", "crypt32", "propsys",
             "kernel32", "gdi32", "winspool", "uuid", "comdlg32"]

# ---------------------------------------------------------------- macOS ----
[target.macos.build]
# `.mm` is a first-class C++ source kind in mcpp but is NOT in the default
# glob (src/**/*.{cppm,cpp,cc,c,S,s,asm}), so it must be listed explicitly.
sources  = ["platform/macos/*.mm"]
cxxflags = ["-fobjc-arc"]
# `-weak_framework` has no neutral spelling; [runtime] frameworks covers only
# ordinary framework linkage.
ldflags  = ["-weak_framework", "UniformTypeIdentifiers"]

# frameworks belongs to the TOP-LEVEL [runtime] table. The per-target
# vocabulary is `libraries` / `link_library_dirs` only, so a
# [target.macos.runtime] frameworks entry is reported and ignored -- the build
# then fails at link on macOS alone. Unconditional here is correct: the engine
# renders this only for Mach-O (src/build/flags.cppm, `flavor == MachO`), the
# same shape [resources] has for PE.
[runtime]
frameworks = ["AppKit", "AVFoundation", "Carbon", "CoreGraphics", "CoreImage",
              "CoreText", "CoreVideo", "ImageIO", "Foundation", "Metal",
              "MetalPerformanceShaders", "QuartzCore", "UserNotifications"]
