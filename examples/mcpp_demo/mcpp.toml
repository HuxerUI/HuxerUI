# A HuxerUI application built natively by mcpp.
#
# Everything this file used to spell out by hand -- the SDK include directory,
# the HuxerUI static library, twenty absolute /lib64/*.so paths and a runtime
# library_dirs entry -- is now supplied by the `huxerui` dependency edge. A
# dependency's build.mcpp emits link-lib/link-search that reach the FINAL link,
# so GTK arrives here without this manifest naming it.

[package]
name        = "huxerui-mcpp-demo"
version     = "0.1.0"
standard    = "c++20"
description = "A HuxerUI page built natively by mcpp"

[dependencies]
huxerui = { path = "../.." }

[targets.huxerui_mcpp_demo]
kind = "bin"
main = "src/main.cpp"

[build]
# huxerui.rules owns the source selection: a build program can ADD a source but
# cannot replace one, so a package that also globbed src/**/*.cpp would link
# both the original and the hcg-transformed copy of every composable.
sources = []

# The Windows executable's icon and the version metadata its Properties dialog
# shows. FILEVERSION, ProductName, FileDescription and CompanyName all default
# from [package], so this one line is the whole thing.
#
# ONLY PE TARGETS COMPILE THIS. On Linux and macOS the table is inapplicable --
# no resource units, no diagnostics, byte-identical build -- so it is written
# unconditionally and needs no cfg(windows) predicate. The file's existence IS
# checked on every target, which is what catches a typo on the Linux build
# rather than on the Windows one.
[resources]
icon = "assets/app.ico"
