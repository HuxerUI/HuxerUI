import groovy.json.JsonSlurper

pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

// The integration that builds the application core: the one -PhuxeruiBuildSystem names, the project's only
// declaration, or CMake when the project declares both. Everything else in this shell is shared.
def huxeruiProjectRoot = file("../..")
def huxeruiDeclarations = [
        cmake: new File(huxeruiProjectRoot, "CMakeLists.txt").isFile(),
        mcpp : new File(huxeruiProjectRoot, "mcpp.toml").isFile() && new File(huxeruiProjectRoot, "build.mcpp").isFile(),
]
def huxeruiBuildSystem = providers.gradleProperty("huxeruiBuildSystem").orNull
if (huxeruiBuildSystem == null) {
    def declared = huxeruiDeclarations.findAll { it.value }.keySet().toList()
    if (declared.isEmpty()) {
        throw new GradleException("The project declares no build system: ${huxeruiProjectRoot}")
    }
    huxeruiBuildSystem = declared.first()
} else if (!huxeruiDeclarations[huxeruiBuildSystem]) {
    throw new GradleException("The project has no ${huxeruiBuildSystem} declaration")
}

// CMake takes the framework from HUXERUI_HOME; mcpp resolves it as a dependency and records where.
def huxeruiHome
if (huxeruiBuildSystem == "mcpp") {
    def frameworkRecord = file("../../.huxerui/generated/framework.json")
    if (!frameworkRecord.isFile()) {
        throw new GradleException("Run 'huxerui build android' to resolve the framework")
    }
    huxeruiHome = file(new JsonSlurper().parse(frameworkRecord).sourceRoot)
} else {
    def huxeruiHomeValue = providers.environmentVariable("HUXERUI_HOME").orNull
    if (huxeruiHomeValue == null || huxeruiHomeValue.isBlank()) {
        throw new GradleException("HUXERUI_HOME is required")
    }
    huxeruiHome = file(huxeruiHomeValue)
}
def huxeruiLibrary = new File(huxeruiHome, "platform/android/huxerui")
def huxeruiArchive = new File(huxeruiHome, "share/huxerui/platform/android/HuxerUI.aar")
def huxeruiUsesSource = huxeruiLibrary.isDirectory()
if (!huxeruiUsesSource && !huxeruiArchive.isFile()) {
    throw new GradleException("HuxerUI Android package does not exist under ${huxeruiHome}")
}

def huxeruiLibraryGraphFile = file("../../.huxerui/generated/libraries.json")
if (!huxeruiLibraryGraphFile.isFile()) {
    throw new GradleException("Run 'huxerui build android' to generate the library graph")
}
def huxeruiLibraryGraph = new JsonSlurper().parse(huxeruiLibraryGraphFile)
def huxeruiLibraries = []

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

gradle.ext.huxeruiBuildSystem = huxeruiBuildSystem
gradle.ext.huxeruiHome = huxeruiHome
gradle.ext.huxeruiUsesSource = huxeruiUsesSource
gradle.ext.huxeruiAndroidArchive = huxeruiArchive
rootProject.name = "@PROJECT_NAME@"
if (huxeruiUsesSource) {
    include(":HuxerUI")
    project(":HuxerUI").projectDir = huxeruiLibrary
}
huxeruiLibraryGraph.libraries.eachWithIndex { library, index ->
    def libraryDirectory = file("${library.sourceRoot}/platform/android")
    if (libraryDirectory.isDirectory()) {
        if (!new File(libraryDirectory, "build.gradle").isFile()) {
            throw new GradleException("Android library package is missing build.gradle: ${libraryDirectory}")
        }
        def projectPath = ":huxeruiLibrary${index}"
        include(projectPath)
        project(projectPath).projectDir = libraryDirectory
        huxeruiLibraries.add([target: library.target, projectPath: projectPath])
    }
}
gradle.ext.huxeruiLibraries = huxeruiLibraries
include(":app")
