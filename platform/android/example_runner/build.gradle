plugins {
    alias(libs.plugins.android.application)
}

def huxeruiRoot = rootProject.projectDir.parentFile.parentFile
def huxeruiExample = providers.gradleProperty("huxeruiExample").orElse("ui_gallery").get()
def huxeruiExampleJava = new File(huxeruiRoot, "examples/${huxeruiExample}/android/src/main/java")
def huxeruiCompileSdk = providers.gradleProperty("huxeruiCompileSdk").map { it.toInteger() }.get()
def huxeruiMinSdk = providers.gradleProperty("huxeruiMinSdk").map { it.toInteger() }.get()
def huxeruiTargetSdk = providers.gradleProperty("huxeruiTargetSdk").map { it.toInteger() }.get()
def huxeruiNdkVersion = providers.gradleProperty("huxeruiNdkVersion").get()
def huxeruiAbis = providers.gradleProperty("huxeruiAbis").get().split(",")
def huxeruiStl = providers.gradleProperty("huxeruiStl").get()
def huxeruiDebugAssets = layout.buildDirectory.dir(
        "generated/huxerui/assets/debug/${huxeruiExample}").get().asFile
def huxeruiReleaseAssets = layout.buildDirectory.dir(
        "generated/huxerui/assets/release/${huxeruiExample}").get().asFile

android {
    namespace = "org.huxerui.examples"
    compileSdk = huxeruiCompileSdk
    ndkVersion = huxeruiNdkVersion

    defaultConfig {
        applicationId = "org.huxerui.examples"
        minSdk = huxeruiMinSdk
        targetSdk = huxeruiTargetSdk
        versionCode = 1
        versionName = "1.0"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=${huxeruiStl}",
                        "-DHUXERUI_ROOT_DIR=${huxeruiRoot.absolutePath}",
                        "-DHUXERUI_EXAMPLE=${huxeruiExample}"
            }
        }

        ndk {
            abiFilters(*huxeruiAbis)
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile(
                    "proguard-android-optimize.txt"),
                    "proguard-rules.pro"
        }
    }

    sourceSets {
        main {
            java.srcDir huxeruiExampleJava
        }
        debug {
            assets.srcDir huxeruiDebugAssets
        }
        release {
            assets.srcDir huxeruiReleaseAssets
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
        }
    }

    buildFeatures {
        prefab = true
    }

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation project(":HuxerUI")
}

def registerHuxerUIResourceStaging = { String buildType, File assetsDirectory ->
    def capitalizedBuildType = buildType.capitalize()
    def nativeTaskName = "externalNativeBuild${capitalizedBuildType}"
    def resolveResourcePackage = {
        def indexFiles = fileTree(file(".cxx/${capitalizedBuildType}")) {
            include "**/example/huxerui-resources/example_${huxeruiExample}/package/huxerui/resources.bin"
        }.files
        // ABI packages are deterministic. Prefer arm64 and the newest active CMake configuration hash.
        def preferredIndexFiles = indexFiles.findAll {
            it.absolutePath.contains("${File.separator}arm64-v8a${File.separator}")
        }
        def candidates = preferredIndexFiles.empty ? indexFiles : preferredIndexFiles
        def selected = candidates.max { left, right ->
            def modified = left.lastModified() <=> right.lastModified()
            modified != 0 ? modified : left.absolutePath <=> right.absolutePath
        }
        selected == null ? null : selected.parentFile.parentFile
    }
    def verificationTask = tasks.register("verifyHuxerUI${capitalizedBuildType}Resources") {
        dependsOn nativeTaskName
        doLast {
            if (resolveResourcePackage() == null) {
                throw new GradleException(
                        "HuxerUI Android example runner resource package is missing for ${huxeruiExample}")
            }
        }
    }
    def stagingTask = tasks.register("stageHuxerUI${capitalizedBuildType}Resources", Sync) {
        dependsOn verificationTask
        from { resolveResourcePackage() ?: [] }
        into assetsDirectory
    }
    tasks.matching { it.name == "merge${capitalizedBuildType}Assets" }.configureEach {
        dependsOn stagingTask
    }
}

registerHuxerUIResourceStaging("debug", huxeruiDebugAssets)
registerHuxerUIResourceStaging("release", huxeruiReleaseAssets)
