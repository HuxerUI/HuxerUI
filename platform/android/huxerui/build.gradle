plugins {
    alias(libs.plugins.android.library)
}

def huxeruiDefaults = new Properties()
file("../gradle.properties").withInputStream { huxeruiDefaults.load(it) }
def huxeruiProperty = { String name ->
    providers.gradleProperty(name).orElse(huxeruiDefaults.getProperty(name)).get()
}
def huxeruiCompileSdk = huxeruiProperty("huxeruiCompileSdk").toInteger()
def huxeruiMinCompileSdk = huxeruiProperty("huxeruiMinCompileSdk").toInteger()
def huxeruiMinSdk = huxeruiProperty("huxeruiMinSdk").toInteger()
def huxeruiNdkVersion = huxeruiProperty("huxeruiNdkVersion")
def huxeruiAbis = huxeruiProperty("huxeruiAbis").split(",")
def huxeruiStl = huxeruiProperty("huxeruiStl")
def huxeruiBuildNative = huxeruiProperty("huxeruiBuildNative").toBoolean()

android {
    namespace = "org.huxerui"
    compileSdk = huxeruiCompileSdk

    defaultConfig {
        minSdk = huxeruiMinSdk
        consumerProguardFiles "consumer-rules.pro"

        aarMetadata {
            minCompileSdk = huxeruiMinCompileSdk
        }

        if (huxeruiBuildNative) {
            externalNativeBuild {
                cmake {
                    targets "huxerui", "huxerui_static"
                    arguments "-DANDROID_STL=${huxeruiStl}",
                            "-DHUXERUI_BUILD_SHARED=ON",
                            "-DHUXERUI_BUILD_STATIC=ON",
                            "-DHUXERUI_BUILD_TESTS=OFF",
                            "-DHUXERUI_BUILD_EXAMPLES=OFF"
                }
            }

            ndk {
                abiFilters(*huxeruiAbis)
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    if (huxeruiBuildNative) {
        ndkVersion = huxeruiNdkVersion

        externalNativeBuild {
            cmake {
                path = file("../../../CMakeLists.txt")
            }
        }

        buildFeatures {
            prefabPublishing = true
        }

        prefab {
            huxerui {
                headers = "../../../include"
            }
        }
    }
}
